events { worker_connections 1024; }
http {
  server {
    listen 80;
    client_max_body_size 2m;
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /socket.io/ { proxy_pass http://api:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
    location / { proxy_pass http://api:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Request-ID $request_id; }
  }
}
