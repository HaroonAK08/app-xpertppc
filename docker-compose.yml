services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lead_saas
      POSTGRES_USER: lead_saas
      POSTGRES_PASSWORD: lead_saas
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lead_saas:lead_saas@postgres:5432/lead_saas
    command: ["corepack", "pnpm", "--filter", "@lead-saas/database", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lead_saas:lead_saas@postgres:5432/lead_saas
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose: ["3000"]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lead_saas:lead_saas@postgres:5432/lead_saas
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  nginx:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nginx
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
