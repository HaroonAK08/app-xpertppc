<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead CRM Admin</title>
<style>:root{font-family:Inter,system-ui;color:#13231d;background:#f4f7f5}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:18px;margin:12px 0}.metric{font-size:30px;font-weight:800;color:#16805b}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #b9cac2}button{background:#16805b;color:#fff;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8eeeb}.error{color:#b42318}</style></head>
<body><main class="wrap"><div class="top"><div><small>INTERNAL OPERATIONS</small><h1>Lead CRM Admin</h1></div><button id="logout">Clear session</button></div><section class="card" id="login"><h2>Authenticate</h2><p>Use a system-administrator account. Organization owners are not system administrators.</p><input id="email" type="email" placeholder="Email"> <input id="password" type="password" placeholder="Password"> <button id="signin">Sign in</button><p class="error" id="error"></p></section><section id="dashboard" hidden><div class="grid" id="metrics"></div><div class="card"><h2>Organizations</h2><table><thead><tr><th>Name</th><th>Plan</th><th>Users</th><th>Leads</th><th>Messages</th></tr></thead><tbody id="organizations"></tbody></table></div></section></main>
<script>
const api='/v1';let token=sessionStorage.getItem('adminToken');const error=document.querySelector('#error');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){const r=await fetch(api+path,{...options,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...options.headers}});const b=await r.json();if(!r.ok)throw new Error(b.error?.message||'Request failed');return b}
async function load(){if(!token)return;try{const d=await request('/admin/overview');document.querySelector('#login').hidden=true;document.querySelector('#dashboard').hidden=false;document.querySelector('#metrics').innerHTML=Object.entries(d.totals).map(([k,v])=>`<div class="card"><div class="metric">${Number(v)}</div><div>${esc(k)}</div></div>`).join('');document.querySelector('#organizations').innerHTML=d.organizations.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.plan?.name||'—')}</td><td>${Number(o._count.memberships)}</td><td>${Number(o._count.leads)}</td><td>${Number(o._count.messages)}</td></tr>`).join('')}catch(e){error.textContent=e.message}}
document.querySelector('#signin').onclick=async()=>{try{const r=await request('/auth/login',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});token=r.accessToken;sessionStorage.setItem('adminToken',token);await load()}catch(e){error.textContent=e.message}};document.querySelector('#logout').onclick=()=>{sessionStorage.clear();location.reload()};void load();
</script></body></html>
